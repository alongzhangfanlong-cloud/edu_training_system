server:
  port: 8080

edu:
  upload-path: ${EDU_UPLOAD_PATH:upload}
  user:
    default-password: ${EDU_USER_DEFAULT_PASSWORD:123456}

spring:
  application:
    name: edu-server
  profiles:
    active: dev

  # 日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# JWT配置
jwt:
  secret: ${JWT_SECRET:Education-Store-2026-JWT-Secret-Key-Must-Be-At-Least-256-Bits-Long-For-HS256}
  access-token-ttl: 7200
  refresh-token-ttl: 604800

# 微信小程序配置
wechat:
  mini-app:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    subscribe-templates:
      SIGN_IN: ""
      HOMEWORK: ""
      LEAVE: ""
      EVALUATION: ""
      REDEMPTION: ""

# CORS 允许的前端域名（逗号分隔）
edu:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j API文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志
logging:
  level:
    com.education.store: debug
