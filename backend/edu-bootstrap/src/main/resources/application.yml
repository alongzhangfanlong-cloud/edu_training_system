server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: edu-training-system
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.edu.modules
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT
jwt:
  secret: edu-training-system-secret-key-2024-min-length-32-chars
  access-token-expire-ms: 604800000
  refresh-token-expire-ms: 2592000000

# ===== 支付配置 =====
# 生产环境: 填写微信/支付宝真实密钥后即可使用
payment:
  wechat:
    app-id:           # 微信公众号/小程序AppID
    mch-id:           # 微信支付商户号
    api-key:          # 微信支付APIv3密钥
    cert-path:        # 微信支付证书路径(apiclient_cert.p12)
  alipay:
    app-id:           # 支付宝应用AppID
    private-key:      # 应用私钥路径或内容
    public-key:       # 支付宝公钥路径或内容
  notify-url: http://localhost:8080/api/v1/payment/notify  # 回调地址(生产改域名)

# SpringDoc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
